<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#020817" />
  <title>ShyneTyme Lights — Iteration 3</title>
  <style>html,body{margin:0;min-height:100%;background:#020817;color:#dff6ff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="boot">Loading ShyneTyme Lights — Iteration 3…</div>
  <script>
    (async () => {
      const stamp = "20260907-iter3";
      const r = await fetch(`./st-ble-ui-preview.html?v=${stamp}`, { cache: "no-store" });
      if (!r.ok) throw new Error(`Controller shell HTTP ${r.status}`);
      let html = await r.text();

      const persistentBle = `<script>
        (() => {
          let busy=false,timer=0;
          async function restoreSavedBle(){
            if(busy||document.visibilityState==="hidden"||!window.STWBLE)return;
            if(window.STWBLE.snapshot?.().passkey)return;
            busy=true;
            try{
              await window.STWBLE.refreshGranted?.();
              let ids=window.STWBLE.targetMemberIds?.()||[];
              let state=window.STWBLE.snapshot?.()||{devices:[]};
              if(!ids.length){
                const first=state.devices?.find(d=>d.bluetoothId);
                if(first){window.STWBLE.selectDevice?.(first.id);ids=[first.id];}
              }
              for(const id of ids){
                state=window.STWBLE.snapshot?.()||{devices:[]};
                const d=state.devices?.find(x=>x.id===id);
                if(!d?.bluetoothId||d.bleStatus==="connected")continue;
                try{await window.STWBLE.connectAssigned(id);}catch(_){}
              }
            }finally{busy=false;}
          }
          function queueRestore(){clearTimeout(timer);timer=setTimeout(restoreSavedBle,260);}
          document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")queueRestore();});
          window.addEventListener("pageshow",queueRestore);
          window.addEventListener("focus",queueRestore);
          setTimeout(queueRestore,900);
        })();
      <\/script>`;

      const iter3 = `<script>
        (() => {
          "use strict";
          const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const DIRECT_MUSIC=["VU","SPECTRUM","AUDIO_PULSE","BEAT_FLASH","SONIC_STREAM","SONIC_BOOM","RIPPLE","STARBURST","POPCORN","DRIPDROP","HEARTBEAT"];
          const SPECIAL_META={
            SOLID:"1 COLOR · FOREGROUND",
            RAINBOW:"0 USER COLORS · BUILT-IN RAINBOW",
            RAINBOW_GLITTER:"1 COLOR · MAIN + BUILT-IN RAINBOW",
            POLICE:"2 COLORS · FOREGROUND + MAIN",
            FLASH:"2 COLORS · BACKGROUND + MAIN"
          };
          let micOn=false,micStream=null,audioCtx=null,analyser=null,raf=0,audioBusy=false,lastSend=0,bassBase=12,lastBeat=0;

          function log(msg){const x=q("#debugLog");if(!x)return;const ts=new Date().toLocaleTimeString();x.textContent=(ts+"  "+msg+"\\n"+x.textContent).slice(0,5000);}
          function snap(){return window.STWBLE?.snapshot?.()||{devices:[],target:null,passkey:false};}
          function targetDevice(){const s=snap();if(s.target?.type!=="device")return null;return s.devices.find(d=>d.id===s.target.id)||null;}
          function palette(){return {main:(q("#main")?.value||"#FFFFFF").toUpperCase(),bg:(q("#bg")?.value||"#000000").toUpperCase(),fg:(q("#fg")?.value||"#FF2CA8").toUpperCase()};}
          function hex2(v){return clamp(Math.round(v),0,255).toString(16).padStart(2,"0").toUpperCase();}
          function meter(id,v){const x=q("#"+id);if(x)x.textContent=Math.round(v);}

          function decorateEffects(){
            qa("#effectList .fx-item").forEach(b=>{
              const fx=b.dataset.fx, small=b.querySelector("small");
              if(!fx||!small)return;
              small.textContent=SPECIAL_META[fx]||"3 COLORS · BACKGROUND + FOREGROUND + MAIN";
              small.title="Verified direct V5.2 firmware renderer";
            });
          }
          const fxHost=q("#effectList");
          if(fxHost){new MutationObserver(decorateEffects).observe(fxHost,{childList:true,subtree:true});decorateEffects();}

          function syncMusicSelection(){
            const old=q("#stwMusicFx");
            if(!old||old.dataset.iter3==="1")return;
            const sel=old.cloneNode(false);
            sel.dataset.iter3="1";
            old.replaceWith(sel);
            const current=targetDevice()?.lastStatus?.FX||targetDevice()?.lastFx||"VU";
            for(const fx of DIRECT_MUSIC){const o=document.createElement("option");o.value=fx;o.textContent=fx.replaceAll("_"," ");sel.append(o);}
            sel.value=DIRECT_MUSIC.includes(current)?current:"VU";
            sel.addEventListener("change",async()=>{
              const fx=sel.value,p=palette();
              const cmd=`MAIN=${p.main.slice(1)};BG=${p.bg.slice(1)};FG=${p.fg.slice(1)};FX=${fx};AUDIO=1;AUDMODE=FULL;AUDAMT=255`;
              const ok=await window.STWBLE.send(cmd);
              if(!ok){log("Music effect not sent: no connected target.");return;}
              window.STWBLE.setLastFx?.(fx);
              const state=q("#stateFx");if(state)state.textContent=fx.replaceAll("_"," ");
              qa(".fx-item").forEach(b=>b.classList.toggle("on",b.dataset.fx===fx));
              const id=window.STWBLE.targetMemberIds?.()[0];
              if(id)setTimeout(async()=>{const st=await window.STWBLE.readStatus?.(id);if(st&&st.FX!==fx)log(`Music FX verify failed: requested ${fx}, ESP32 reports ${st.FX||"?"}.`);else if(st)log(`Music FX verified: ${fx}.`);},180);
            });
          }

          const BANDS=[[43,86],[86,129],[129,216],[216,301],[301,430],[430,560],[560,818],[818,1120],[1120,1421],[1421,1895],[1895,2412],[2412,3015],[3015,3704],[3704,4479],[4479,7106],[7106,9259]];
          function bandValue(fd,lo,hi){
            const hz=audioCtx.sampleRate/analyser.fftSize,a=clamp(Math.floor(lo/hz),0,fd.length-1),b=clamp(Math.ceil(Math.min(hi,audioCtx.sampleRate/2)/hz),a+1,fd.length);
            let sum=0;for(let i=a;i<b;i++)sum+=fd[i];return b>a?sum/(b-a):0;
          }
          function setMicUi(live,detail=""){
            const b=q("#micToggle"),s=q("#micState");if(b)b.textContent=live?"STOP MICROPHONE":"START MICROPHONE";
            if(s){s.textContent=live?"LIVE":(detail||"OFF");s.classList.toggle("live",live);}
          }
          function stopMic(send=true){
            micOn=false;if(raf)cancelAnimationFrame(raf);raf=0;micStream?.getTracks().forEach(t=>t.stop());micStream=null;
            audioCtx?.close().catch(()=>{});audioCtx=null;analyser=null;audioBusy=false;qa(".spectrum-bar").forEach(b=>b.style.height="4%");setMicUi(false);
            if(send)window.STWBLE.send("AUDIO=0");
          }
          async function sendCompact(vals,beat){
            if(audioBusy)return;audioBusy=true;
            try{
              const bass=(vals[0]+vals[1]+vals[2]+vals[3])/4,mid=(vals[4]+vals[5]+vals[6]+vals[7]+vals[8]+vals[9])/6,high=(vals[10]+vals[11]+vals[12]+vals[13]+vals[14]+vals[15])/6;
              const avg=vals.reduce((a,b)=>a+b,0)/vals.length,level=Math.max(avg,bass,mid,high);
              const packet="A="+hex2(level)+hex2(bass)+hex2(mid)+hex2(high)+(beat?"1":"0");
              const ok=await window.STWBLE.send(packet,{fast:true});
              if(!ok){setMicUi(false,"NO BLE");return;}
              meter("stwAL",level);meter("stwAB",bass);meter("stwAM",mid);meter("stwAH",high);const tx=q("#stwATX");if(tx)tx.textContent=(+tx.textContent+1)%10000;
            }catch(e){log("Audio TX: "+e.message);}finally{audioBusy=false;}
          }
          function loop(t=performance.now()){
            if(!micOn||!analyser||!audioCtx)return;
            const fd=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(fd);
            const userGain=+(q("#micSensitivity")?.value||135)/100;
            const vals=BANDS.map(([lo,hi])=>clamp((bandValue(fd,lo,hi)-5)*userGain*1.9,0,255));
            qa(".spectrum-bar").forEach((b,i)=>b.style.height=Math.max(4,vals[i]/255*100).toFixed(1)+"%");
            const bass=(vals[0]+vals[1]+vals[2]+vals[3])/4;bassBase=bassBase*.94+bass*.06;const beat=bass>Math.max(24,bassBase*1.35)&&t-lastBeat>165;if(beat)lastBeat=t;
            if(t-lastSend>=80){lastSend=t;sendCompact(vals,beat);}raf=requestAnimationFrame(loop);
          }
          async function startMic(){
            try{
              if(!window.isSecureContext)throw new Error("Microphone requires HTTPS.");
              micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
              const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC({latencyHint:"interactive"});if(audioCtx.state==="suspended")await audioCtx.resume();
              analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.minDecibels=-90;analyser.maxDecibels=-10;analyser.smoothingTimeConstant=.24;audioCtx.createMediaStreamSource(micStream).connect(analyser);
              const ok=await window.STWBLE.send("AUDIO=1;AUDMODE=FULL;AUDAMT=255");if(!ok)throw new Error("No connected BLE target");
              micOn=true;setMicUi(true);lastSend=0;loop();log("Microphone active; compact A= audio stream started.");
              const id=window.STWBLE.targetMemberIds?.()[0];if(id)setTimeout(async()=>{const st=await window.STWBLE.readStatus?.(id);if(st)log(`Audio link: AUDLIVE=${st.AUDLIVE||"0"} ARX=${st.ARX||"0"} FX=${st.FX||"?"}.`);},700);
            }catch(e){log("Microphone/audio failed: "+e.message);stopMic(false);}
          }
          async function audioTest(){
            const ok=await window.STWBLE.send("AUDIO=1;AUDMODE=FULL;AUDAMT=255");if(!ok){log("Audio test needs a connected target.");return;}
            for(let n=0;n<10;n++){const vals=Array.from({length:16},(_,i)=>i<4?235:i<10?170:115);await sendCompact(vals,n%2===0);await new Promise(r=>setTimeout(r,110));}
            const id=window.STWBLE.targetMemberIds?.()[0];if(id){const st=await window.STWBLE.readStatus?.(id);if(st)log(`Audio test status: AUDLIVE=${st.AUDLIVE||"0"} ARX=${st.ARX||"0"}.`);}
          }
          function installAudio(){
            const old=q("#micToggle");if(old&&old.dataset.iter3!=="1"){const b=old.cloneNode(true);b.dataset.iter3="1";old.replaceWith(b);b.addEventListener("click",()=>micOn?stopMic(true):startMic());}
            const oldTest=q("#stwAudioTest");if(oldTest){const b=oldTest.cloneNode(true);oldTest.replaceWith(b);b.addEventListener("click",audioTest);}
            const oldStop=q("#stwAudioStop");if(oldStop){const b=oldStop.cloneNode(true);oldStop.replaceWith(b);b.addEventListener("click",()=>stopMic(true));}
          }

          function startupCommand(fx){
            const d=targetDevice(),st=d?.lastStatus||{},p=palette();
            return `FX=${fx};MAIN=${p.main.slice(1)};BG=${p.bg.slice(1)};FG=${p.fg.slice(1)};BGB=${q("#int")?.value||st.BGB||64};MAINB=${st.MAINB||180};FGB=${st.FGB||220};BRI=${q("#bri")?.value||st.BRI||96};SPD=${q("#spd")?.value||st.SPD||180};INT=${st.INT||180};SIZE=${q("#size")?.value||st.SIZE||96};DENS=${q("#dens")?.value||st.DENS||128};TRAIL=${q("#trail")?.value||st.TRAIL||170};DIR=${q("#dir")?.value||st.DIR||"FWD"};MIRROR=${q("#mirror")?.checked?1:0}`;
          }
          function configFromUi(){return {leds:+q("#leds").value,gpio:+q("#gpio").value,order:q("#order").value,segFrom:+q("#segFrom").value,segTo:+q("#segTo").value,startupFx:q("#startupFx").value};}
          function installStartupFix(){
            const old=q("#saveDeviceReboot");
            if(old){const b=old.cloneNode(true);old.replaceWith(b);b.addEventListener("click",async()=>{
              const d=targetDevice();if(!d){log("Select one connected device first.");return;}
              const fx=q("#startupFx").value,name=q("#deviceName").value.trim()||d.name;
              try{
                await window.STWBLE.saveDeviceConfig(d.id,configFromUi(),{reboot:false});window.STWBLE.renameDevice?.(d.id,name);
                await window.STWBLE.sendToDevice(d.id,startupCommand(fx));await window.STWBLE.sendToDevice(d.id,"SAVE");
                log(`Saved startup ${fx.replaceAll("_"," ")} and rebooting ${name}.`);await window.STWBLE.sendToDevice(d.id,"REBOOT");
              }catch(e){log("Save + reboot: "+e.message);}
            });}
            const oldStart=q("#saveStartup");
            if(oldStart){const b=oldStart.cloneNode(true);oldStart.replaceWith(b);b.addEventListener("click",async()=>{
              const d=targetDevice();if(!d)return;const fx=q("#startupFx").value,restore=d.lastStatus?.FX||d.lastFx||"RAINBOW";
              try{await window.STWBLE.saveStartup(d.id,startupCommand(fx),`FX=${restore}`,fx);log(`Startup effect saved as ${fx.replaceAll("_"," ")}.`);}catch(e){log("Save startup: "+e.message);}
            });}
          }

          syncMusicSelection();installAudio();installStartupFix();decorateEffects();
          log("Iteration 3 loaded: direct effect role labels, compact BLE audio, direct music list, startup save/reboot fix.");
        })();
      <\/script>`;

      html = html
        .replace(/st-ble-ui\.css\?v=[^"']+/g, `st-ble-ui.css?v=${stamp}`)
        .replace(/st-ble-core\.js\?v=[^"']+/g, `st-ble-core.js?v=${stamp}`)
        .replace(/st-ble-ui\.js\?v=[^"']+/g, `st-ble-ui.js?v=${stamp}`)
        .replace(/st-ble-live\.js\?v=[^"']+/g, `st-ble-live.js?v=${stamp}`)
        .replace("</body>", `<script src="st-ble-bgfix.js?v=${stamp}"><\/script><script src="st-ble-playlist.js?v=${stamp}"><\/script>${persistentBle}${iter3}</body>`);
      document.open();
      document.write(html);
      document.close();
    })().catch((e) => {
      document.body.innerHTML = `<div class="boot"><b>Controller failed to load.</b><br><br>${String(e.message || e)}</div>`;
    });
  </script>
</body>
</html>
