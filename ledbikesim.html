<main class="sim-stage" id="main-content">
  <section class="sim-shell" id="simShell" aria-label="Bike LED simulator">
    <div class="sim-viewport" id="simViewport">
      <div class="bike-canvas">
        <svg id="bikePreview" viewBox="0 0 1020 756" role="img" aria-labelledby="bikeTitle bikeDesc">
          <title id="bikeTitle">Interactive ShyneTyme.Works LED bicycle</title>
          <desc id="bikeDesc">Select a bicycle part to switch its temporary Streaming Rainbow LED preset on or off.</desc>
          <defs>
            <linearGradient id="streamingRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ff2ca8"><animate attributeName="stop-color" values="#ff2ca8;#ffd928;#18e9ff;#ff2ca8" dur="2.8s" repeatCount="indefinite"/></stop>
              <stop offset="50%" stop-color="#ffd928"><animate attributeName="stop-color" values="#ffd928;#18e9ff;#ff2ca8;#ffd928" dur="2.8s" repeatCount="indefinite"/></stop>
              <stop offset="100%" stop-color="#18e9ff"><animate attributeName="stop-color" values="#18e9ff;#ff2ca8;#ffd928;#18e9ff" dur="2.8s" repeatCount="indefinite"/></stop>
            </linearGradient>
          </defs>
          <image class="bike-scene-bg" href="assets/images/bike-planner-street.webp" width="1020" height="756" preserveAspectRatio="xMidYMid slice"/>
          <path class="bike-ground" d="M20 630H995"/>
          <g aria-hidden="true">
            <circle class="bike-fixture" cx="430" cy="510" r="118"/><circle class="bike-fixture" cx="850" cy="510" r="118"/>

            <path class="bike-metal" d="M730 310L850 510M750 310L870 505"/>

          </g>
          <g class="bike-zone bike-zone--stroke is-on" data-bike-zone="frame" role="button" tabindex="0" aria-label="Frame" aria-pressed="true" fill="none" stroke-width="18"><path d="M430 510L630 510L560 350L430 510"/><path d="M560 350C610 420 660 395 730 310"/><path d="M630 510L730 310"/></g>
          <g class="bike-zone bike-zone--stroke is-off" data-bike-zone="front-forks" role="button" tabindex="0" aria-label="Front Forks" aria-pressed="false" fill="none" stroke-width="15"><path d="M730 310L850 510"/><path d="M750 310L870 505"/></g>

          <rect class="bike-zone bike-zone--fill is-off" data-bike-zone="front-basket" role="button" tabindex="0" aria-label="Front Basket" aria-pressed="false" x="775" y="265" width="175" height="112" rx="12" stroke-width="8"/>
          <rect class="bike-zone bike-zone--fill is-off" data-bike-zone="rear-basket" role="button" tabindex="0" aria-label="Rear Basket" aria-pressed="false" x="300" y="300" width="135" height="98" rx="12" stroke-width="8"/>
          <rect class="bike-zone bike-zone--fill is-off" data-bike-zone="handlebar-pouch" role="button" tabindex="0" aria-label="Handlebar Pouch" aria-pressed="false" x="675" y="252" width="92" height="60" rx="12" stroke-width="8"/>
          <path class="bike-zone bike-zone--fill is-off" data-bike-zone="rear-pouch" role="button" tabindex="0" aria-label="Rear Pouch" aria-pressed="false" d="M505 273H580L567 326H518Z" stroke-width="8"/>
          <g class="bike-zone bike-zone--stroke is-off" data-bike-zone="flag-pole" role="button" tabindex="0" aria-label="Flag Pole" aria-pressed="false" fill="none" stroke-width="13"><path d="M300 330V125"/></g>
          <rect class="bike-zone bike-zone--fill is-off" data-bike-zone="tail-light" role="button" tabindex="0" aria-label="Tail Light" aria-pressed="false" x="350" y="425" width="34" height="25" rx="7" stroke-width="6"/>
