[platformio]
default_envs = Shynetyme_ESP32

[env:Shynetyme_ESP32]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} ShynetymeBLE
lib_deps =
  ${env:esp32dev.lib_deps}
  h2zero/NimBLE-Arduino @ 2.5.0
build_flags =
  ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=\"Shynetyme_ESP32_2\"
