name: Build ESP32 #2 WLED Orchestrator

on:
  workflow_dispatch:
  push:
    paths:
      - 'ESP32/ESP32-2-Orchestrator/**'
      - '.github/workflows/build-esp32-2-wled.yml'
  pull_request:
    paths:
      - 'ESP32/ESP32-2-Orchestrator/**'
      - '.github/workflows/build-esp32-2-wled.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shynetyme repo
        uses: actions/checkout@v4

      - name: Get WLED 16.0.1 source
        run: git clone --depth 1 --branch v16.0.1 https://github.com/wled/WLED.git WLED

      - name: Add Shynetyme BLE usermod and build config
        run: |
          cp -r ESP32/ESP32-2-Orchestrator/usermods/ShynetymeBLE WLED/usermods/ShynetymeBLE
          cp ESP32/ESP32-2-Orchestrator/platformio_override.ini WLED/platformio_override.ini

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r WLED/requirements.txt

      - name: Build one combined firmware image
        id: fwbuild
        working-directory: WLED
        run: pio run -e Shynetyme_ESP32

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p ESP32/ESP32-2-Orchestrator/firmware
          cp WLED/.pio/build/Shynetyme_ESP32/firmware.bin ESP32/ESP32-2-Orchestrator/firmware/Shynetyme_ESP32_2_WLED_BLE.bin

      - name: Write build status
        if: always()
        run: |
          mkdir -p ESP32/ESP32-2-Orchestrator/firmware
          if [ "${{ job.status }}" = "success" ]; then
            echo "SUCCESS" > ESP32/ESP32-2-Orchestrator/firmware/BUILD-STATUS.txt
          else
            echo "FAILED" > ESP32/ESP32-2-Orchestrator/firmware/BUILD-STATUS.txt
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> ESP32/ESP32-2-Orchestrator/firmware/BUILD-STATUS.txt

      - name: Commit firmware or failure marker back to repo
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ESP32/ESP32-2-Orchestrator/firmware
          git diff --cached --quiet || git commit -m "Build ESP32 #2 WLED BLE firmware"
          git push

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shynetyme-ESP32-2-WLED-BLE
          path: ESP32/ESP32-2-Orchestrator/firmware/Shynetyme_ESP32_2_WLED_BLE.bin
