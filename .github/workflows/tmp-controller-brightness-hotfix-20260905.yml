name: Temporary Controller Brightness Hotfix 2026-09-05

on:
  push:
    branches:
      - tmp/controller-brightness-hotfix-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch brightness semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/st-ble-ui.js')
          s=p.read_text()
          s=s.replace("if(st.BRI!=null)q('#bri').value=st.BRI;", "if(st.MAINB!=null)q('#bri').value=st.MAINB;")
          s=s.replace(";BGB=${q('#int').value};BRI=${q('#bri').value};SPD=", ";BGB=${q('#int').value};MAINB=${q('#bri').value};SPD=")
          old="if(e.detail?.type==='connected')log(`${snap.devices.find(d=>d.id===e.detail.deviceId)?.name||'ESP32'} Bluetooth connected.`);"
          new="if(e.detail?.type==='connected'){log(`${snap.devices.find(d=>d.id===e.detail.deviceId)?.name||'ESP32'} Bluetooth connected.`);STWBLE.sendToDevice(e.detail.deviceId,'BRI=255',{fast:true})}"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          h=Path('tools/st-ble-ui-preview.html')
          t=h.read_text()
          t=t.replace('<label>BRIGHTNESS</label>','<label>MAIN BRIGHTNESS</label>',1)
          t=t.replace('st-ble-ui.js?v=20260905-colors2','st-ble-ui.js?v=20260905-colors3')
          h.write_text(t)
          PY
          node --check tools/st-ble-ui.js
          git config user.name "Deke310"
          git config user.email "135410011+Deke206@users.noreply.github.com"
          git add tools/st-ble-ui.js tools/st-ble-ui-preview.html
          git commit -m "Set full global output and separate main background brightness"
          git push origin HEAD:main
