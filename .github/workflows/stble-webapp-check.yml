name: STBLE Web App Check

on:
  push:
    paths:
      - "tools/st-ble-**"
      - "tools/stble-**"
      - "tools/AGENTS.md"
      - "tools/STBLE_FIRMWARE_CONTRACT.md"
      - ".github/workflows/stble-webapp-check.yml"
  pull_request:
    paths:
      - "tools/st-ble-**"
      - "tools/stble-**"
      - "tools/AGENTS.md"
      - "tools/STBLE_FIRMWARE_CONTRACT.md"
      - ".github/workflows/stble-webapp-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check tools/st-ble-core.js
          node --check tools/st-ble-ui.js
          node --check tools/stble-regression-check.mjs

      - name: STBLE regression contract
        run: node tools/stble-regression-check.mjs

      - name: Canonical HTML script ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Ec '<script[[:space:]]+src="st-ble-core\.js\?' tools/st-ble-ui-preview.html)" -eq 1
          test "$(grep -Ec '<script[[:space:]]+src="st-ble-ui\.js\?' tools/st-ble-ui-preview.html)" -eq 1
          ! grep -Eq '<script[^>]+st-ble-(live|bgfix|playlist|hotfix|uuidfix)\.js' tools/st-ble-ui-preview.html

      - name: Build verified controller bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified-stble-controller/tools
          cp tools/st-ble-ui-preview.html verified-stble-controller/tools/
          cp tools/st-ble-ui.css verified-stble-controller/tools/
          cp tools/st-ble-core.js verified-stble-controller/tools/
          cp tools/st-ble-ui.js verified-stble-controller/tools/
          cp tools/AGENTS.md verified-stble-controller/tools/
          cp tools/STBLE_FIRMWARE_CONTRACT.md verified-stble-controller/tools/
          cp tools/stble-regression-check.mjs verified-stble-controller/tools/
          printf '%s\n' "Commit: $GITHUB_SHA" > verified-stble-controller/VERIFIED_COMMIT.txt

      - name: Upload verified controller artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-stble-controller-${{ github.sha }}
          path: verified-stble-controller
          if-no-files-found: error
          retention-days: 30
