name: Temporary Controller Comment Cleanup Export 2026-09-05

on:
  push:
    branches:
      - tmp/controller-comment-cleanup-20260905

permissions:
  contents: write

jobs:
  document-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current live main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Format controller files
        run: |
          npx --yes prettier@3.3.3 --write \
            tools/st-ble-ui-preview.html \
            tools/st-ble-ui.css \
            tools/st-ble-ui.js \
            tools/st-ble-core.js

      - name: Add maintenance comments without changing behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          def add_once(text, needle, comment):
              if comment.strip() in text or needle not in text:
                  return text
              return text.replace(needle, comment + "\n" + needle, 1)

          # HTML ----------------------------------------------------------------
          hp = Path('tools/st-ble-ui-preview.html')
          h = hp.read_text()
          header = '''<!--
            ShyneTyme.Works ESP32 LED controller — live page shell.
            Maintenance snapshot: 2026-09-05.

            Dependency order is intentional:
              1. st-ble-ui.css  — presentation only.
              2. st-ble-core.js — Bluetooth, device/group state, BLE writes.
              3. st-ble-ui.js   — tabs, effects, colors, music, presets, preview.

            Current controller contract:
              - RAINBOW remains the startup/connection confirmation effect.
              - MAIN BRIGHTNESS sends MAINB.
              - BACKGROUND BRIGHTNESS sends BGB.
              - The UI sends BRI=255 once after BLE connection so the firmware's
                global FastLED cap does not dim the visible role-brightness controls.
              - Selecting an effect does not restore canned per-effect colors.
              - The effect browser exposes only direct V5.2 firmware effect IDs.
          -->'''
          if header not in h:
              h = h.replace('<!doctype html>', '<!doctype html>\n' + header, 1)
          for needle, comment in [
              ('<header class="topbar">', '<!-- Global brand/status bar. #bleSummary reports active local BLE links. -->'),
              ('<nav class="tabs"', '<!-- Five application tabs. Gated tabs require a connected selected device or complete group. -->'),
              ('<section class="live-state"', '<!-- Persistent selected-device/effect summary and lightweight LED preview. -->'),
              ('<section id="device"', '<!-- DEVICE: logical ESP32 cards, Bluetooth assignment, per-device settings, debug, and groups. -->'),
              ('<section id="fxcolor"', '<!-- FX / COLORS: direct firmware effects, role colors, and effect styling controls. -->'),
              ('<section id="music"', '<!-- MUSIC: microphone capture and 16-channel FFT feed. Audio effects are selected in FX / COLORS. -->'),
              ('<section id="presets"', '<!-- PRESETS: saved effect/color/style states with compact editing. -->'),
              ('<section id="custom"', '<!-- CUSTOM: ordered local playlist of saved effect states. -->'),
              ('<div id="modal"', '<!-- Shared confirmation/name modal. -->'),
              ('<script src="st-ble-core.js', '<!-- BLE core loads first because st-ble-ui.js consumes window.STWBLE. -->'),
              ('<script src="st-ble-ui.js', '<!-- UI controller binds the page after the BLE core is available. -->'),
          ]:
              h = add_once(h, needle, comment)
          h = re.sub(r'st-ble-ui\.css\?v=[^"\']+', 'st-ble-ui.css?v=20260905-documented1', h)
          h = re.sub(r'st-ble-core\.js\?v=[^"\']+', 'st-ble-core.js?v=20260905-documented1', h)
          h = re.sub(r'st-ble-ui\.js\?v=[^"\']+', 'st-ble-ui.js?v=20260905-documented1', h)
          hp.write_text(h)

          # CSS -----------------------------------------------------------------
          cp = Path('tools/st-ble-ui.css')
          c = cp.read_text()
          css_header = '''/*
           * ShyneTyme.Works ESP32 controller presentation layer.
           * Maintenance snapshot: 2026-09-05.
           *
           * Presentation only: Bluetooth/device/effect behavior lives in JavaScript.
           * Preserve the midnight-blue foundation, ShyneTyme pink/yellow/blue accents,
           * compact glass controls, and continuous motion language unless intentionally
           * redesigning the product.
           */'''
          if css_header not in c:
              c = css_header + '\n\n' + c
          for needle, comment in [
              (':root {', '/* Design tokens: midnight-blue surfaces and ShyneTyme accent colors. */'),
              ('html,\nbody {', '/* Document foundation and monochrome midnight-blue page background. */'),
              ('.topbar {', '/* Sticky brand/header chrome. */'),
              ('.tabs {', '/* Five-tab navigation and selected/locked states. */'),
              ('.live-state {', '/* Persistent selected-device/effect viewer. */'),
              ('.workspace {', '/* Main application workspace and page visibility. */'),
              ('.context-frame {', '/* Reusable animated glass frame for functional areas. */'),
              ('.matrix-lanes', '/* Decorative matrix lanes; pointer events stay disabled. */'),
              ('.glass-btn', '/* Shared tactile buttons, fields, role buttons, and compact controls. */'),
              ('.device-zone', '/* Device-area framing and logical ESP32 layout. */'),
              ('.device-card', '/* Logical ESP32 card; JS drives selection/power/Bluetooth state. */'),
              ('.ble-dot', '/* Bluetooth state indicator: unassigned/assigned/connecting/connected. */'),
              ('.group-frame', '/* Device grouping and explicit simulcast selection. */'),
              ('.fx-layout', '/* FX / COLORS two-column layout. */'),
              ('.slider-row', '/* Firmware styling controls. MAINB and BGB are independent role brightness values. */'),
              ('.hue-selector', '/* User color selector; effect selection must not restore canned palettes. */'),
              ('.effect-list', '/* Direct firmware effect selectors. Individual effect buttons intentionally have no border. */'),
              ('.music-layout', '/* Microphone controls and 16-channel spectrograph. */'),
              ('.preset-grid', '/* Local preset cards and mini editors. */'),
              ('.playlist-list', '/* Local ordered playlist rows. */'),
              ('.modal {', '/* Shared blocking confirmation/name dialog. */'),
              ('@keyframes', '/* Continuous ShyneTyme motion system. */'),
              ('@media', '/* Responsive reductions for tablet/phone layouts. */'),
          ]:
              c = add_once(c, needle, comment)
          cp.write_text(c)

          # Shared helper: add a short comment above named functions that do not
          # already have a nearby maintenance comment.
          def document_functions(text, label):
              lines = text.splitlines()
              out = []
              for line in lines:
                  m = re.match(r'^(async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', line)
                  if m:
                      name = m.group(2)
                      recent = '\n'.join(out[-3:])
                      if '//' not in recent and '*/' not in recent:
                          out.append(f'// {label}: {name}().')
                  out.append(line)
              return '\n'.join(out) + '\n'

          # UI JS ---------------------------------------------------------------
          up = Path('tools/st-ble-ui.js')
          u = up.read_text()
          ui_header = '''/*
           * ShyneTyme.Works ESP32 controller UI layer.
           * Maintenance snapshot: 2026-09-05.
           *
           * Responsibilities:
           *   - Render tabs, logical devices/groups, effects, colors, presets,
           *     playlists, microphone analysis, and the lightweight preview.
           *   - Send verified V5.2 command keys through STWBLE.
           *   - Keep user-selected MAIN/BG/FG colors global; selecting another effect
           *     never restores hidden pink/yellow/blue per-effect palettes.
           *   - Preserve RAINBOW as the startup/connection confirmation behavior.
           *   - MAIN BRIGHTNESS -> MAINB; BACKGROUND BRIGHTNESS -> BGB.
           *   - After BLE connection send BRI=255 once so firmware's global cap does
           *     not throttle the visible role-brightness controls.
           *
           * Direct V5.2 effects exposed by this basic controller:
           *   Basic/built-in: OFF, SOLID, RAINBOW, RAINBOW_GLITTER.
           *   Motion/chase: COMET, METEOR, SCANNER, DUAL_SCANNER, POLICE, CHASE,
           *     TRICOLOR_CHASE, RUNNING_DOTS, THEATER, WIPE, FLOW, FLOW_STRIPE,
           *     COLOR_WAVES, SINELON, JUGGLE.
           *   Spark/particle: SPARKLE, GLITTER, TWINKLE, TWINKLEFOX, TWINKLECAT,
           *     FIREWORKS, RAIN, TETRIX, BOUNCING_BALLS, POPCORN, DRIPDROP.
           *   Atmosphere/show: FIRE, LIGHTNING, PACIFICA, SUNRISE, DANCING_SHADOWS,
           *     PRIDE, RIPPLE, STARBURST, LAVA_LAMP, MAGMA, AURORA, HEARTBEAT,
           *     BREATHE, FLASH, DUAL_FLASH.
           *   Audio/music: SONIC_STREAM, SONIC_BOOM, VU, SPECTRUM, AUDIO_PULSE,
           *     BEAT_FLASH. Music data is sent as the firmware's 16-bin F= packet.
           */'''
          if ui_header not in u:
              u = u.replace("'use strict';", "'use strict';\n\n" + ui_header, 1)
          for needle, comment in [
              ('const EFFECTS =', '// Firmware-direct IDs only. Add an effect only when V5.2 setEffect() accepts that exact ID.'),
              ('const EFFECT_META =', '// Display-only behavior/type labels; these labels never alter firmware rendering.'),
              ('const AUDIO_BANDS =', '// Sixteen analysis bands used to build V5.2 F=<32 hex chars>[beat] packets.'),
              ('let snap =', '// UI runtime state. BLE/device truth is refreshed from STWBLE.snapshot().'),
              ('const loadJSON =', '// Local-only storage helpers for presets, playlists, saved colors, and UI preferences.'),
              ('function injectMatrix', '// Build decorative matrix lanes/music notes once; visual only.'),
              ('function fillSelect', '// Fill effect dropdowns from the same verified direct-effect list.'),
              ('function activatePage', '// Switch tabs; gated pages return to Device until a connected target has passkey.'),
              ('function boardMarkup', '// Render the logical ESP32 card surface.'),
              ('function renderGroups', '// Group editor. Selecting a group is the only deliberate simulcast path.'),
              ('function syncFromTarget', '// Pull device status into visible controls without restoring canned per-effect palettes.'),
              ('function renderEffects', '// Render verified direct effect selectors and their type labels.'),
              ('async function chooseEffect', '// Send the shortest verified FX command for responsive effect changes.'),
              ('function buildCommand', '// Serialize complete saved state. MAINB and BGB are independent brightness commands.'),
              ('function setPaletteUI', '// Update visible MAIN/BG/FG controls only; no per-effect palette restore occurs here.'),
              ('function rgbToHue', '// Color conversion helpers for the hue selector.'),
              ('function renderSavedColors', '// Saved-color buttons update the chosen role and explicitly send current role colors.'),
              ('const sliderKeys =', '// Styling command map: bri=MAINB, int=BGB, plus SPD/SIZE/DENS/TRAIL.'),
              ('function captureState', '// Snapshot the current effect/color/style state for presets/playlists.'),
              ('async function applyState', '// Apply a saved preset/playlist state through the verified command serializer.'),
              ('function renderPresets', '// Preset cards and compact preset editor.'),
              ('function addPlaylist', '// Append a captured effect state to the local playlist.'),
              ('function renderPlaylist', '// Render playlist rows; playback reuses applyState in sequence.'),
              ('function renderSpectrumBase', '// Create sixteen visual spectrum bars and their frequency labels.'),
              ('async function startMic', '// Request microphone input and start low-latency FFT analysis.'),
              ('function audioLoop', '// Analyze microphone bins and stream bounded-rate F= packets to the selected target.'),
              ('function effectMode', '// Browser-preview classifier only; never changes the physical firmware effect.'),
              ('function previewLoop', '// Draw the small top preview at about 30 FPS without BLE traffic.'),
              ('function modal', '// Shared Promise-based confirmation/name modal.'),
              ("document.addEventListener('stw:ble'", '// Consume BLE-core state events. On connect, raise firmware global BRI cap to 255 without changing RAINBOW.'),
              ('try {\n  localStorage.removeItem(PALETTE_KEY);', '// Retire obsolete per-effect palette memory so old default colors cannot reappear.'),
          ]:
              u = add_once(u, needle, comment)
          u = document_functions(u, 'UI helper')
          up.write_text(u)

          # BLE core ------------------------------------------------------------
          bp = Path('tools/st-ble-core.js')
          b = bp.read_text()
          core_header = '''/*
           * ShyneTyme.Works Web Bluetooth core.
           * Maintenance snapshot: 2026-09-05.
           *
           * Responsibilities:
           *   - Own logical-device/group/selected-target persistence.
           *   - Remember browser-granted Bluetooth device IDs and reconnect by ID.
           *   - Serialize GATT connection attempts so Android is not asked to open
           *     overlapping connections.
           *   - Serialize writes per controller and split semicolon command strings
           *     into BLE-safe chunks.
           *   - Default targeting is one selected device. Multiple controllers receive
           *     commands only through an explicitly selected complete group.
           *
           * Firmware UUID contract:
           *   service  78170001-7a32-4b19-913a-5354594d4501
           *   command  78170002-7a32-4b19-913a-5354594d4501
           *   status   78170003-7a32-4b19-913a-5354594d4501
           */'''
          if core_header not in b:
              b = b.replace("'use strict';", "'use strict';\n\n" + core_header, 1)
          for needle, comment in [
              ('const STW_SERVICE_UUID', '// BLE UUID and storage keys. UUIDs must remain aligned with the ESP32 firmware.'),
              ('const DEFAULT_CONFIG', '// Default logical-device configuration; startup RAINBOW is intentional.'),
              ('function loadJSON', '// Defensive localStorage helpers.'),
              ('let devices =', '// Persistent logical devices/groups/target plus ephemeral granted/runtime connection state.'),
              ('function runtime', '// Per-logical-device runtime GATT state and write queue.'),
              ('function emit', '// Publish a complete state snapshot to the UI through the stw:ble CustomEvent.'),
              ('function targetMemberIds', '// Resolve the selected single device or explicit group into command recipients.'),
              ('function hasPasskey', '// Gate controls until the selected device or every selected-group member is connected.'),
              ('function beginManualBluetooth', '// Manual Bluetooth interaction cancels/preempts startup autoconnect.'),
              ('async function writeRaw', '// Perform one GATT write; short fast controls prefer write-without-response when available.'),
              ('function queueWrite', '// Serialize each controller write stream to prevent overlapping GATT writes.'),
              ('function parseStatus', '// Parse firmware semicolon-delimited KEY=VALUE status text.'),
              ('async function refreshGranted', '// Refresh browser-granted devices through navigator.bluetooth.getDevices().'),
              ('function attachDisconnect', '// Reset runtime connection state when Android/browser reports GATT disconnect.'),
              ('async function openGatt', '// Connect GATT with bounded retries/timeouts.'),
              ('async function connectAssigned', '// Reconnect one logical device to its remembered browser Bluetooth device ID.'),
              ('async function assignGranted', '// Assign an already browser-granted physical device to a logical ESP32.'),
              ('async function assignNew', '// One-time Web Bluetooth permission picker for a new physical controller.'),
              ('async function autoConnect', '// Startup reconnect yields immediately to manual Bluetooth interaction.'),
              ('function disconnectDevice', '// Drop GATT runtime state without forgetting the saved Bluetooth assignment.'),
              ('function selectDevice', '// Select exactly one logical device as the normal command target.'),
              ('function selectGroup', '// Select an explicit group as the simulcast target.'),
              ('function createGroup', '// Persistent group CRUD used by the Device tab.'),
              ('function validateConfig', '// Validate per-device settings before firmware configuration commands are sent.'),
              ('async function saveDeviceConfig', '// Persist LED count/GPIO/order to the selected physical ESP32.'),
              ('window.STWBLE', '// Public API consumed by st-ble-ui.js. Keep this surface stable during internal refactors.'),
          ]:
              b = add_once(b, needle, comment)
          b = document_functions(b, 'BLE-core helper')
          bp.write_text(b)

      - name: Reformat documented files
        run: |
          npx --yes prettier@3.3.3 --write \
            tools/st-ble-ui-preview.html \
            tools/st-ble-ui.css \
            tools/st-ble-ui.js \
            tools/st-ble-core.js

      - name: Validate JavaScript and page structure
        run: |
          node --check tools/st-ble-ui.js
          node --check tools/st-ble-core.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('tools/st-ble-ui-preview.html').read_text()
          ids = re.findall(r'\bid=["\']([^"\']+)', html)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if dup:
              raise SystemExit('Duplicate HTML ids: ' + ', '.join(dup))
          for dep in ['st-ble-ui.css', 'st-ble-core.js', 'st-ble-ui.js']:
              if dep not in html:
                  raise SystemExit('Missing dependency: ' + dep)
          ui = Path('tools/st-ble-ui.js').read_text()
          for token in ['MAINB', 'BGB', 'BRI=255', 'RAINBOW', 'EFFECTS']:
              if token not in ui:
                  raise SystemExit('Required controller behavior missing: ' + token)
          print('Validation passed:', len(ids), 'HTML ids; JS syntax OK; required behavior present.')
          PY

      - name: Commit documented live controller to main
        run: |
          git config user.name "Deke310"
          git config user.email "135410011+Deke206@users.noreply.github.com"
          git add tools/st-ble-ui-preview.html tools/st-ble-ui.css tools/st-ble-ui.js tools/st-ble-core.js
          if git diff --cached --quiet; then
            echo "No controller cleanup changes to commit"
          else
            git commit -m "Document and organize live ESP32 controller files"
            git push origin HEAD:main
          fi

      - name: Package exact live dependency folder
        run: |
          rm -rf controller-export
          mkdir -p controller-export
          cp tools/st-ble-ui-preview.html controller-export/
          cp tools/st-ble-ui.css controller-export/
          cp tools/st-ble-ui.js controller-export/
          cp tools/st-ble-core.js controller-export/
          sha256sum controller-export/* | sort > controller-export/SHA256SUMS.txt

      - name: Upload exact controller export
        uses: actions/upload-artifact@v4
        with:
          name: ShyneTyme-Controller-2026-09-05
          path: controller-export/
          if-no-files-found: error
          retention-days: 1
