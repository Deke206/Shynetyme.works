<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dynamic LED SIM Stage | ShyneTyme.Works</title>
    <meta name="description" content="Interactive 3D/Flash-style LED simulator stage for Auto, Home, Bike, and Boat with shared ShyneTyme.Works controls." />
    <meta name="theme-color" content="#020610" />
    <link rel="icon" sizes="32x32" type="image/png" href="assets/brand/Favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/Site.css?v=20260918" rel="stylesheet" />
    <link href="assets/css/Sim-Controls-V2.css?v=20260918" rel="stylesheet" />
    <link href="assets/css/Auto-Sim-V2.css?v=20260918" rel="stylesheet" />
  </head>
  <body class="v56-page auto-sim-page ledautosim-page" data-simulator="dynamic">

    <!-- PRIMARY NAVBAR -->
    <nav aria-label="Primary navigation" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold brand-lockup" href="index.html">
          <img alt="" height="34" src="assets/brand/favicon-32.png" width="34" />
          <span>ShyneTyme.<em>Works</em></span>
        </a>
        <button aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navMenu" data-bs-toggle="collapse" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="aboutme.html">ABOUT DEKE</a>
            <a class="nav-link" href="ledexpo.html">LED EXPO</a>
            <div class="nav-item dropdown shynetyme-build-menu" data-shynetyme-build-menu="true">
              <button aria-expanded="false" aria-label="Open LED simulator menu" class="nav-link dropdown-toggle active" data-bs-toggle="dropdown" type="button">
                LED SIM STAGE
              </button>
              <ul aria-label="LED simulator pages" class="dropdown-menu dropdown-menu-dark">
                <li><button class="dropdown-item" data-stage-mode="auto">🚘 AUTO SIM</button></li>
                <li><button class="dropdown-item" data-stage-mode="home">🏠 HOME SIM</button></li>
                <li><button class="dropdown-item" data-stage-mode="bike">🏍️ BIKE SIM</button></li>
                <li><button class="dropdown-item" data-stage-mode="boat">🛥️ BOAT SIM</button></li>
              </ul>
            </div>
            <a class="nav-link" href="project-power.html">PROJECT POWER</a>
            <a class="nav-link" href="contact.html">CONTACT</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- 4-IN-1 STAGE SWITCHER BAR -->
    <section class="bg-dark border-bottom border-secondary py-2">
      <div class="container d-flex justify-content-center gap-2 flex-wrap" id="stageModeBar">
        <button type="button" class="btn btn-outline-info active" data-stage-mode="auto">🚘 AUTO SIM</button>
        <button type="button" class="btn btn-outline-info" data-stage-mode="home">🏠 HOME SIM</button>
        <button type="button" class="btn btn-outline-info" data-stage-mode="bike">🏍️ BIKE SIM</button>
        <button type="button" class="btn btn-outline-info" data-stage-mode="boat">🛥️ BOAT SIM</button>
      </div>
    </section>

    <!-- MAIN SIMULATOR STAGE -->
    <main class="sim-stage" id="main-content">
      <div class="app-grid" id="appGrid">

        <!-- SIDE RAIL (DEVICE TILES) -->
        <aside class="side-rail" id="sideRail">
          <button aria-label="Show controls" class="sidebar-toggle" data-state="closed" id="sidebarToggle" type="button">
            <span aria-hidden="true" class="rail-state-indicator">
              <span class="rail-step">›</span><span class="rail-step">›</span><span class="rail-step">›</span>
            </span>
          </button>
          <div class="rail-switch">
            <button class="active" data-rail="devices" type="button"><span>DEVICES</span></button>
            <button data-rail="groups" type="button"><span>GROUPS</span></button>
          </div>
          <div class="device-stack" id="devicePane">
            <!-- Dynamic device tiles injected by sim-stage-engine.js -->
          </div>
          <div class="device-pop" id="devicePop">Target Active</div>
        </aside>

        <!-- VIEWPORT WORKSPACE -->
        <section class="workspace">
          <header class="topbar">
            <div aria-label="SIM views" class="view-strip" role="group" id="viewStrip">
              <!-- Dynamic View Chips injected by sim-stage-engine.js -->
            </div>
            <div class="status-right">
              <span class="connected">● <span class="status-label">CONNECTED</span></span>
              <span aria-label="Wi-Fi" class="wifi" role="img"><i></i></span>
              <span class="battery"><span class="battery-box"><i></i></span><span class="status-label">100%</span></span>
            </div>
          </header>

          <div class="viewport" id="viewport" style="position: relative; overflow: hidden; background: #020610;">
            <!-- SCENE BACKGROUND IMAGE -->
            <img alt="Simulator stage scene" class="sim-scene is-active" id="viewportImg" src="assets/images/auto-sim-cyberpunk-rear34.jpg" style="width: 100%; height: 100%; object-fit: cover;" />

            <!-- DYNAMIC SVG LED OVERLAY -->
            <svg id="simLedSvg" viewBox="0 0 800 600" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
              <!-- Dynamic vector LED paths rendered by sim-stage-engine.js -->
            </svg>
          </div>

          <button aria-label="Fullscreen" class="fullscreen-trigger" id="fullscreenTrigger" title="Fullscreen" type="button">⛶</button>

          <!-- CONTROL DRAWER -->
          <section class="sim-control-drawer" id="simControlDrawer">
            <button aria-controls="simDrawerSurface" aria-expanded="false" aria-label="Open simulator controls" class="sim-drawer-handle btn" id="simDrawerHandle" type="button">
              <span>CONTROLS</span><span aria-hidden="true" class="sim-drawer-handle__arrow">⌃</span>
            </button>
            <div class="sim-control-drawer__surface" id="simDrawerSurface" inert>
              <div class="sim-drawer-meta">
                <span class="sim-drawer-meta__label">ACTIVE TARGET</span>
                <strong class="sim-drawer-meta__target" id="activeTarget">UNDERGLOW</strong>
              </div>
              <nav aria-label="Simulator control categories" class="nav nav-tabs nav-fill sim-drawer-tabs" role="tablist">
                <button aria-controls="effectsPane" aria-selected="true" class="nav-link active" data-bs-target="#effectsPane" data-bs-toggle="tab" id="effectsTab" role="tab" style="--tab-color: #18e9ff" type="button">LED EFFECTS</button>
                <button aria-controls="musicPane" aria-selected="false" class="nav-link" data-bs-target="#musicPane" data-bs-toggle="tab" id="musicTab" role="tab" style="--tab-color: #36bfff" type="button">MUSIC SYNC</button>
                <button aria-controls="presetsPane" aria-selected="false" class="nav-link" data-bs-target="#presetsPane" data-bs-toggle="tab" id="presetsTab" role="tab" style="--tab-color: #ffd928" type="button">PRESETS</button>
                <button aria-controls="customPane" aria-selected="false" class="nav-link" data-bs-target="#customPane" data-bs-toggle="tab" id="customTab" role="tab" style="--tab-color: #ff2ca8" type="button">CUSTOM EFFECTS</button>
              </nav>
              <div class="tab-content sim-drawer-content">
                <!-- LED EFFECTS TAB -->
                <div aria-labelledby="effectsTab" class="tab-pane fade show active" id="effectsPane" role="tabpanel" tabindex="0">
                  <div class="container-fluid px-2 px-sm-3 py-3">
                    <div class="row g-3">
                      <div class="col-12 col-lg-7">
                        <section aria-label="LED effects" class="sim-control-card">
                          <h2 class="sim-control-title">LED EFFECTS</h2>
                          <div class="row g-3">
                            <div class="col-12 col-md-4">
                              <label class="form-label" for="effectSelect">EFFECT</label>
                              <select class="form-select" id="effectSelect">
                                <option>Streaming Rainbow</option>
                                <option>Chase</option>
                                <option>Solid</option>
                                <option>Breathe</option>
                                <option>Scanner</option>
                                <option>Twinkle</option>
                                <option>Wave</option>
                              </select>
                            </div>
                            <div class="col-12 col-sm-6 col-md-4">
                              <label class="form-label" for="speedRange">SPEED</label>
                              <div class="d-flex align-items-center gap-2">
                                <input class="form-range" id="speedRange" max="100" min="0" type="range" value="68" />
                                <output class="sim-range-value" id="speedOutput">68%</output>
                              </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-4">
                              <label class="form-label" for="brightnessRange">BRIGHTNESS</label>
                              <div class="d-flex align-items-center gap-2">
                                <input class="form-range" id="brightnessRange" max="100" min="0" type="range" value="82" />
                                <output class="sim-range-value" id="brightnessOutput">82%</output>
                              </div>
                            </div>
                          </div>
                        </section>
                      </div>
                      <div class="col-12 col-lg-5">
                        <section aria-label="Saved colors" class="sim-control-card">
                          <h2 class="sim-control-title">SAVED COLORS</h2>
                          <div class="sim-palette mb-3">
                            <button aria-label="Hot pink" class="sim-swatch active" style="--sw: #ff2ca8" type="button"></button>
                            <button aria-label="Cyan" class="sim-swatch" style="--sw: #18e9ff" type="button"></button>
                            <button aria-label="Yellow" class="sim-swatch" style="--sw: #ffd928" type="button"></button>
                            <button aria-label="Purple" class="sim-swatch" style="--sw: #8b51ff" type="button"></button>
                          </div>
                        </section>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- MUSIC SYNC TAB -->
                <div aria-labelledby="musicTab" class="tab-pane fade" id="musicPane" role="tabpanel" tabindex="0">
                  <div class="container-fluid px-2 px-sm-3 py-3">
                    <div class="row g-3">
                      <div class="col-12 col-lg-6">
                        <section class="sim-control-card">
                          <h2 class="sim-control-title">MUSIC PLAYER</h2>
                          <div class="track-now">SHYNETYME AUDIO SYNC READY</div>
                        </section>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- PRESETS TAB -->
                <div aria-labelledby="presetsTab" class="tab-pane fade" id="presetsPane" role="tabpanel" tabindex="0">
                  <div class="container-fluid px-2 px-sm-3 py-3">
                    <section class="sim-control-card">
                      <h2 class="sim-control-title">PRESETS</h2>
                      <div class="d-flex gap-2 flex-wrap">
                        <button class="btn sim-preset-button" style="--preset-color: #18e9ff" type="button">SOLID</button>
                        <button class="btn sim-preset-button" style="--preset-color: #ff2ca8" type="button">CHASE</button>
                        <button class="btn sim-preset-button" style="--preset-color: #ffd928" type="button">RAINBOW</button>
                      </div>
                    </section>
                  </div>
                </div>

                <!-- CUSTOM EFFECTS TAB -->
                <div aria-labelledby="customTab" class="tab-pane fade" id="customPane" role="tabpanel" tabindex="0">
                  <div class="container-fluid px-2 px-sm-3 py-3">
                    <section class="sim-control-card">
                      <h2 class="sim-control-title">CUSTOM EFFECTS</h2>
                      <div class="d-flex gap-2 flex-wrap">
                        <button class="btn sim-custom-button" style="--preset-color: #ff2ca8" type="button">LA NIGHTS</button>
                        <button class="btn sim-custom-button" style="--preset-color: #18e9ff" type="button">CYBER FLOW</button>
                      </div>
                    </section>
                  </div>
                </div>

              </div>
            </div>
          </section>

        </section>
      </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/Sim-Controls-V2.js?v=20260918"></script>
    <script src="assets/js/sim-stage-engine.js?v=20260918"></script>
  </body>
</html>
